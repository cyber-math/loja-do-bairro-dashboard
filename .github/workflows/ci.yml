name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar site estático
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verificações
        run: npm run check

      - name: Build do artefato
        run: npm run build

      - name: Conferir artefato
        run: |
          test -f dist/index.html
          test -f dist/version.json
          test -f dist/.nojekyll
          cat dist/version.json
