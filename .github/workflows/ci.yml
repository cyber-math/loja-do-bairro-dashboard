name: CI

# Verificações e build da branch principal.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificações
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload do site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7
