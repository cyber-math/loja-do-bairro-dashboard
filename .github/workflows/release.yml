name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Conferir tag x package.json
        run: node scripts/version.mjs --verify-tag "$GITHUB_REF_NAME"

      - name: Verificações
        run: npm run check

      - name: Build versionado
        run: npm run build

      - name: Empacotar site para download
        run: |
          cd dist
          zip -qr "../loja-do-bairro-dashboard-${GITHUB_REF_NAME}.zip" .
          cd ..
          ls -lh "loja-do-bairro-dashboard-${GITHUB_REF_NAME}.zip"

      - name: Criar release com notas automáticas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "loja-do-bairro-dashboard-${GITHUB_REF_NAME}.zip" \
            --verify-tag \
            --title "Loja do Bairro ${GITHUB_REF_NAME}" \
            --generate-notes
