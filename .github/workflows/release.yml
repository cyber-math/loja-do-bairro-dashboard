name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Conferir tag contra o package.json
        run: node scripts/version.mjs --verify-tag "$GITHUB_REF_NAME"

      - name: Verificações
        run: npm run check

      - name: Build
        run: npm run build

      - name: Empacotar o site
        run: |
          cd dist
          zip -qr "../loja-do-bairro-dashboard-${GITHUB_REF_NAME}.zip" .
          cd ..

      - name: Criar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "loja-do-bairro-dashboard-${GITHUB_REF_NAME}.zip" \
            --verify-tag \
            --title "Loja do Bairro ${GITHUB_REF_NAME}" \
            --generate-notes
