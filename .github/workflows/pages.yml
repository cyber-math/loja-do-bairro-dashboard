name: Deploy · GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar artefato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verificações
        run: npm run check

      - name: Build versionado
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
